# Lastrun host sheet. Read by the scan, never written. Every claim names its source.

id = "codex"
name = "Codex CLI"
vendor = "OpenAI"
kind = "cli"
status = "active"
missing = ["approval per call (the default history mode keeps only the session policy)", "exit code as a field (written in the output text)"]
own_dirs = ["~/.codex"]

[detect]
paths = ["~/.codex"]
binaries = ["codex"]

[unattended]
modes = ["danger-full-access"]
[unattended.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/config-file/config-reference"
read_on = 2026-10-16
quote = "sandbox_mode: read-only | workspace-write | danger-full-access — Sandbox policy for filesystem and network access during command execution."
note = "read for Permitt's sheet; with approval_policy `never` anything that needs approval is rejected, so the sandbox mode is what decides whether commands run without asking"

[[locations]]
scope = "user"
format = "jsonl"
path.any = ["~/.codex/sessions/**/*.jsonl", "~/.codex/sessions/**/*.jsonl.zst", "~/.codex/archived_sessions/**/*.jsonl", "~/.codex/archived_sessions/**/*.jsonl.zst"]
reader = "codex-jsonl"
note = "{timestamp, type, payload}: session_meta (id, cwd), turn_context (cwd, approval_policy, sandbox_policy, model), response_item function_call {name, arguments, call_id} / function_call_output {call_id, output} with \"Exit code: N\" in the text, custom_tool_call apply_patch, event_msg patch_apply_end {changes: {path: add|delete|update}}, mcp_tool_call_end; in the paginated mode item_completed command_execution {command, status, exit_code} and file_change {changes, status, auto_approved}. Compressed to .jsonl.zst after 7 days, never deleted by age."
[locations.source]
kind = "source-code"
url = "https://github.com/openai/codex/blob/ce0323f/codex-rs/rollout/src/policy.rs"
read_on = 2026-10-17
quote = "Transient, non-durable events"
note = "policy.rs L80-155 (persisted items and events), L161-224 (exec_command_end, exec_approval_request not persisted); protocol/src/items.rs L208-213 `CommandExecutionStatus { InProgress, Completed, Failed, Declined }`; core/src/tools/mod.rs L106 `format!(\"Exit code: {}\", …)`; rollout/src/compression.rs L364 `MIN_ROLLOUT_AGE` 7 days"
